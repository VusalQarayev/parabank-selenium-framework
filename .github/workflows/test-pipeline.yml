name: ParaBank Automation CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Google Chrome (Headless)
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Run TestNG Regression Suite via Maven
        run: |
          mvn clean test -Dheadless=true

      - name: Upload Extent Execution Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Extent-Execution-Report
          path: test-output/reports/ExecutionReport.html
          retention-days: 14

      - name: Upload Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Failure-Screenshots
          path: test-output/screenshots/
          retention-days: 7

      - name: Upload Execution Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Log4j-Execution-Logs
          path: test-output/logs/execution.log
          retention-days: 14